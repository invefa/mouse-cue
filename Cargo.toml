[package]
name = "mouse-cue"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mouse-cue"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

[dependencies]
imgui = "0.12"
imgui-glow-renderer = "0.12"
windows = { version = "0.62.2", features = ["Win32_Graphics_DirectComposition", "Win32_Graphics_Dwm", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "UI_Composition", "UI_Composition_Desktop", "Win32_System_WinRT_Composition", "System", "Win32_System_WinRT", "Win32_Graphics_OpenGL", "Win32_System_LibraryLoader"] }
windows-numerics = "0.3"
